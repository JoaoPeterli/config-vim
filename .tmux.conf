################ CORE ################

# Prefixo Ctrl+a
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# True color (ESSENCIAL)
set -g default-terminal "tmux-256color"
set -as terminal-overrides ",*:Tc"

# ESC rápido (Vim)
set -sg escape-time 0

# Mouse
set -g mouse on

# Não renomear janelas
set -g allow-rename off

# Reload config
bind r source-file ~/.tmux.conf \; display "tmux.conf recarregado ✔"

################ SPLITS ################

bind | split-window -h
bind - split-window -v

################ NAVEGAÇÃO ################

# Alt + setas
bind -n M-Left  select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up    select-pane -U
bind -n M-Down  select-pane -D

# Alt + hjkl
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

################ TMUX <-> VIM ################

is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE 'vim|nvim'"

bind -n C-h if-shell "$is_vim" "send-keys C-h" "select-pane -L"
bind -n C-j if-shell "$is_vim" "send-keys C-j" "select-pane -D"
bind -n C-k if-shell "$is_vim" "send-keys C-k" "select-pane -U"
bind -n C-l if-shell "$is_vim" "send-keys C-l" "select-pane -R"

################ VISUAL — ONEHALFDARK ################

# Panes
set -g pane-border-style fg=#3e4451
set -g pane-active-border-style fg=#61afef

# Status bar
set -g status-position bottom
set -g status-style bg=#282c34,fg=#abb2bf
set -g status-interval 2

# Janelas
setw -g window-status-style bg=#282c34,fg=#abb2bf
setw -g window-status-current-style bg=#61afef,fg=#282c34
setw -g window-status-format " #I:#W "
setw -g window-status-current-format " #I:#W "

# Mensagens
set -g message-style bg=#282c34,fg=#e5c07b

# Status content
set -g status-left "#[fg=#61afef]#S #[default]"
set -g status-right "#[fg=#98c379]%Y-%m-%d %H:%M #[default]"

################ PERFORMANCE ################

set -g history-limit 50000
set -g focus-events on

################ TMUX-RESURRECT ################

# Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Salvar processos importantes
set -g @resurrect-processes 'vim nvim npm yarn pnpm rails node tail'

# Auto save a cada 5 minutos
set -g @continuum-restore 'on'
set -g @continuum-save-interval '5'

# Salvar automaticamente ao sair
set -g @resurrect-capture-pane-contents 'off'

run '~/.tmux/plugins/tpm/tpm'

